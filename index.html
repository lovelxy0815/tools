.header {

.theme-toggle {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.3s;
}
.theme-toggle:hover { background: rgba(255,255,255,0.35); }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.search-box {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 15px 0;
}
.search-box input {
  width: 100%;
  padding: 14px 20px;
  font-size: 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.3s;
}
.search-box input:focus { border-color: var(--accent); }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}
.filter-btn {
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn.active, .filter-btn:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.section-title {
  font-size: 18px;
  font-weight: 600;
  margin: 25px 0 12px;
  padding-left: 10px;
  border-left: 4px solid var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px var(--shadow); }
.card h3 { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.card p { font-size: 13px; color: var(--sub); margin-bottom: 10px; line-height: 1.4; }
.card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card a.btn-open {
  display: inline-block;
  background: var(--accent);
  color: white;
  padding: 7px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 13px;
  transition: background 0.2s;
}
.card a.btn-open:hover { background: var(--accent-hover); }
.btn-copy {
  padding: 7px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-copy:hover { border-color: var(--accent); color: var(--accent); }
.btn-copy.copied { background: #4caf50; color: white; border-color: #4caf50; }
.click-count {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 11px;
  color: var(--sub);
  background: var(--tag);
  padding: 2px 8px;
  border-radius: 10px;
}
mark { background: #fff3cd; color: #856404; padding: 0 2px; border-radius: 3px; }
[data-theme="dark"] mark { background: #5a4a1a; color: #ffd54f; }
.hidden { display: none !important; }
.freq-section { margin-top: 20px; }
@media (max-width: 600px) {
  .header h1 { font-size: 22px; }
  .grid { grid-template-columns: 1fr; }
  .card h3 { font-size: 14px; }
}
</style>

var clicks = JSON.parse(localStorage.getItem("toolClicks") || "{}");
var currentFilter = "全部";
var currentKeyword = "";

function init() {
  renderFilters();
  renderAll();
  renderFreq();
}

function renderFilters() {
  var cats = ["全部"];
  tools.forEach(function(t) { if (cats.indexOf(t.c) === -1) cats.push(t.c); });
  var html = "";
  cats.forEach(function(c) {
    html += '<button class="filter-btn' + (c === currentFilter ? ' active' : '') + '" onclick="setFilter(\'' + c + '\')">' + c + '</button>';
  });
  document.getElementById("filters").innerHTML = html;
}

function setFilter(c) {
  currentFilter = c;
  renderFilters();
  renderAll();
}

function search() {
  currentKeyword = document.getElementById("search").value.toLowerCase();
  renderAll();
  renderFreq();
}

function highlight(text) {
  if (!currentKeyword) return text;
  var idx = text.toLowerCase().indexOf(currentKeyword);
  if (idx === -1) return text;
  return text.substring(0, idx) + "<mark>" + text.substring(idx, idx + currentKeyword.length) + "</mark>" + text.substring(idx + currentKeyword.length);
}

function renderAll() {
  var html = "";
  var cats = {};
  tools.forEach(function(t, i) {
    if (currentFilter !== "全部" && t.c !== currentFilter) return;
    if (currentKeyword) {
      var hay = (t.n + t.d + t.k + t.c).toLowerCase();
      if (hay.indexOf(currentKeyword) === -1) return;
    }
    if (!cats[t.c]) cats[t.c] = "";
    cats[t.c] += '<div class="card">' +
      '<span class="click-count">👆 ' + (clicks[t.n] || 0) + '</span>' +
      '<h3>' + highlight(t.n) + '</h3>' +
      '<p>' + highlight(t.d) + '</p>' +
      '<div class="card-actions">' +
        '<a class="btn-open" href="' + t.u + '" target="_blank" rel="noopener" onclick="countClick(\'' + t.n + '\')">打开工具 →</a>' +
        '<button class="btn-copy" onclick="copyUrl(this,\'' + t.u + '\')">📋 复制链接</button>' +
      '</div></div>';
  });
  for (var cat in cats) {
    html += '<div class="section-title">' + cat + '</div><div class="grid">' + cats[cat] + '</div>';
  }
  document.getElementById("allTools").innerHTML = html || '<p style="text-align:center;color:var(--sub);padding:40px;">没有找到匹配的工具</p>';
}

function renderFreq() {
  var freq = Object.keys(clicks).filter(function(k) { return clicks[k] >= 3; });
  if (freq.length === 0) { document.getElementById("freqSection").classList.add("hidden"); return; }
  document.getElementById("freqSection").classList.remove("hidden");
  var html = "";
  freq.sort(function(a, b) { return clicks[b] - clicks[a]; }).forEach(function(name) {
    var t = tools.find(function(x) { return x.n === name; });
    if (!t) return;
    html += '<div class="card"><h3>🔥 ' + t.n + '</h3><p>' + t.d + '</p><div class="card-actions"><a class="btn-open" href="' + t.u + '" target="_blank" onclick="countClick(\'' + t.n + '\')">打开 →</a></div></div>';
  });
  document.getElementById("freqGrid").innerHTML = html;
}

function countClick(name) { clicks[name] = (clicks[name] || 0) + 1; localStorage.setItem("toolClicks", JSON.stringify(clicks)); }

function copyUrl(btn, url) {
  navigator.clipboard.writeText(url).then(function() {
    btn.classList.add("copied");
    btn.textContent = "✅ 已复制";
    setTimeout(function() { btn.classList.remove("copied"); btn.textContent = "📋 复制链接"; }, 2000);
  });
}

function toggleTheme() {
  var body = document.body;
  if (body.getAttribute("data-theme") === "dark") {
    body.removeAttribute("data-theme");
    localStorage.setItem("theme", "light");
  } else {
    body.setAttribute("data-theme", "dark");
    localStorage.setItem("theme", "dark");
  }
}

if (localStorage.getItem("theme") === "dark") document.body.setAttribute("data-theme", "dark");

init();
